<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Unscrambler</title>
    <style>
        /* ── reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f2f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 20, 30, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.7);
            padding: 40px 36px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #0b2a3e, #1b4a6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .subhead {
            color: #3a5e7a;
            font-weight: 400;
            font-size: 1rem;
            margin-bottom: 28px;
            border-left: 4px solid #7aa9c9;
            padding-left: 16px;
            background: rgba(122, 169, 201, 0.08);
            border-radius: 0 12px 12px 0;
            line-height: 1.5;
        }

        /* ── loader ── */
        #loader {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 40px 0;
            color: #1f4b66;
            font-weight: 500;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 4px solid #d0e2f0;
            border-top-color: #1f6e96;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── input area ── */
        .input-section {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 22px;
        }
        .input-section .field {
            flex: 2 1 220px;
            min-width: 160px;
        }
        .input-section .field-sm {
            flex: 0 1 90px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #3d627c;
            margin-bottom: 4px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #dbe8f2;
            border-radius: 20px;
            background: white;
            transition: 0.2s;
            font-weight: 500;
            color: #0f2a3b;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }
        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #3f8db0;
            outline: none;
            box-shadow: 0 0 0 4px rgba(63, 141, 176, 0.15);
        }
        input[type="text"] {
            text-transform: lowercase;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }

        .btn {
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            background: linear-gradient(135deg, #1b5f81, #0f3e58);
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 18px -8px rgba(20, 70, 100, 0.3);
            letter-spacing: 0.01em;
            flex: 0 1 auto;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -8px rgba(20, 70, 100, 0.4);
            background: linear-gradient(135deg, #23749b, #134a66);
        }
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px -4px rgba(20, 70, 100, 0.3);
        }

        .clear-btn {
            background: transparent;
            color: #4d718b;
            box-shadow: none;
            padding: 12px 20px;
            font-weight: 500;
        }
        .clear-btn:hover {
            background: rgba(0, 0, 0, 0.04);
            transform: none;
            box-shadow: none;
            color: #0f2a3b;
        }

        /* ── results ── */
        .result-stats {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 2px solid rgba(63, 141, 176, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }
        .result-stats h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #0f2a3b;
        }
        .result-stats h2 span {
            color: #1b6a8f;
        }
        .result-stats .count {
            background: #dcebf5;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #14415a;
        }

        .word-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
            max-height: 420px;
            overflow-y: auto;
            padding: 4px 2px 8px 2px;
            scroll-behavior: smooth;
        }
        .word-grid::-webkit-scrollbar {
            width: 6px;
        }
        .word-grid::-webkit-scrollbar-track {
            background: #e3edf5;
            border-radius: 8px;
        }
        .word-grid::-webkit-scrollbar-thumb {
            background: #9bbdd3;
            border-radius: 8px;
        }

        .word-tag {
            background: white;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #113a4f;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(63, 141, 176, 0.15);
            transition: 0.1s;
            letter-spacing: 0.01em;
        }
        .word-tag:hover {
            background: #f0f8ff;
            border-color: #5e9fc2;
            transform: scale(1.02);
        }

        .empty-msg {
            color: #6a8ba3;
            font-style: italic;
            padding: 24px 0 12px 0;
            width: 100%;
            text-align: center;
        }

        /* ── responsive ── */
        @media (max-width: 580px) {
            .container {
                padding: 24px 18px;
                border-radius: 32px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .input-section .field,
            .input-section .field-sm {
                flex: 1 1 100%;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            .actions {
                flex-direction: column;
            }
            .clear-btn {
                width: 100%;
                text-align: center;
            }
            .result-stats {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        /* ── hide app until loaded ── */
        #app {
            display: none;
        }
        #app.visible {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>🔤 Word Unscrambler</h1>
        <div class="subhead">
            Enter any letters — find every valid word you can make.
        </div>

        <!-- Loader -->
        <div id="loader">
            <div class="spinner"></div>
            <span>Loading dictionary ( ~370k words )…</span>
        </div>

        <!-- Main app -->
        <div id="app">
            <div class="input-section">
                <div class="field">
                    <label for="letters">Letters</label>
                    <input type="text" id="letters" placeholder="e.g. cbiinr" autocomplete="off" autocorrect="off" spellcheck="false" />
                </div>
                <div class="field-sm">
                    <label for="minLen">Min</label>
                    <input type="number" id="minLen" value="3" min="2" max="10" />
                </div>
                <div class="field-sm">
                    <label for="maxLen">Max</label>
                    <input type="number" id="maxLen" value="7" min="2" max="10" />
                </div>
            </div>

            <div class="actions">
                <button class="btn" id="unscrambleBtn">⚡ Unscramble</button>
                <button class="btn clear-btn" id="clearBtn">✕ Clear</button>
            </div>

            <div class="result-stats">
                <h2>Words <span id="resultCount">0</span></h2>
                <span class="count" id="resultLabel">ready</span>
            </div>

            <div class="word-grid" id="wordGrid">
                <div class="empty-msg">Enter some letters and hit Unscramble.</div>
            </div>
        </div>

    </div>

    <script>
        // ──────────────────────────────────────────────
        // 1.  LOAD DICTIONARY
        // ──────────────────────────────────────────────
        let dictionary = [];

        async function loadDictionary() {
            try {
                const res = await fetch('https://cdn.jsdelivr.net/npm/word-list@3.1.0/words.json');
                if (!res.ok) throw new Error('Network error');
                const words = await res.json();

                // keep only a–z, max length 10, min length 2
                dictionary = words.filter(w =>
                    /^[a-z]+$/.test(w) &&
                    w.length >= 2 &&
                    w.length <= 10
                );

                // optional: limit to 50k common words to keep it snappy?
                // We'll keep all ~370k — modern browsers handle it instantly.
                console.log(`📚 Loaded ${dictionary.length} words.`);
            } catch (err) {
                // fallback: a small built-in list if fetch fails
                console.warn('⚠️ Using fallback dictionary.', err);
                dictionary = [
                    "a", "ab", "abs", "ace", "act", "ad", "add", "ado", "age", "ago", "aid", "ail", "aim", "air",
                    "al", "ale", "all", "am", "an", "and", "ape", "arc", "are", "ark", "arm", "art", "as", "ash",
                    "ask", "at", "ate", "aug", "awe", "ax", "bad", "bag", "ban", "bar", "bat", "bay", "be", "bed",
                    "bee", "bet", "big", "bin", "bit", "bow", "box", "boy", "bud", "bug", "bun", "bus", "but", "buy",
                    "cab", "cal", "cam", "cap", "car", "cat", "caw", "cob", "cod", "cog", "cop", "cot", "cow", "cry",
                    "cub", "cud", "cup", "cur", "cut", "dad", "dam", "day", "den", "dew", "did", "die", "dig", "dim",
                    "din", "dip", "doe", "dog", "dot", "dry", "dub", "dud", "due", "dug", "dye", "ear", "eat", "eel",
                    "egg", "ego", "em", "en", "err", "et", "eve", "ewe", "eye", "fan", "far", "fat", "fax", "fed",
                    "fee", "few", "fig", "fin", "fir", "fit", "fix", "fly", "for", "fox", "fry", "fun", "fur", "gag",
                    "gap", "gas", "gel", "gin", "gnu", "god", "got", "gum", "gun", "gut", "guy", "had", "has", "hat",
                    "hay", "hen", "her", "hew", "hex", "hid", "him", "hip", "his", "hit", "hog", "hop", "hot", "how",
                    "hub", "hue", "hug", "hum", "hut", "ice", "icy", "imp", "ink", "inn", "ion", "irk", "its", "ivy",
                    "jab", "jag", "jam", "jar", "jaw", "jay", "jet", "job", "jog", "jot", "joy", "jug", "jut", "keg",
                    "key", "kid", "kin", "kip", "kit", "lab", "lad", "lag", "lap", "law", "lay", "lea", "let", "lid",
                    "lie", "lip", "lit", "log", "lot", "low", "mad", "man", "mar", "mat", "maw", "max", "may", "men",
                    "met", "mid", "mix", "mod", "mog", "mop", "mow", "mud", "mug", "net", "new", "nil", "nip", "nit",
                    "nod", "nor", "not", "now", "oak", "oar", "oat", "odd", "ode", "off", "oft", "old", "one", "opt",
                    "orb", "ore", "our", "out", "owe", "owl", "own", "pad", "pal", "pan", "pap", "par", "pat", "paw",
                    "pay", "pea", "peg", "pen", "pep", "per", "pet", "pie", "pig", "pin", "pit", "ply", "pod", "pop",
                    "pot", "pow", "pro", "pry", "pub", "pug", "pun", "pus", "put", "rag", "ram", "ran", "rap", "rat",
                    "raw", "red", "ref", "rep", "rib", "rid", "rig", "rim", "rip", "rob", "rod", "roe", "rot", "row",
                    "rub", "rug", "rum", "run", "rut", "rye", "sac", "sad", "sag", "sap", "sat", "saw", "sea", "set",
                    "sew", "she", "shy", "sin", "sip", "sir", "sis", "sit", "six", "ski", "sky", "sly", "sob", "sod",
                    "son", "sot", "sow", "soy", "spa", "spy", "sty", "sub", "sue", "sum", "sun", "tab", "tad", "tag",
                    "tan", "tap", "tar", "tax", "tea", "ten", "the", "thy", "tie", "tin", "tip", "toe", "ton", "too",
                    "top", "tot", "tow", "try", "two", "urn", "use", "van", "vat", "vet", "vex", "via", "vie", "vim",
                    "vow", "wad", "wag", "war", "was", "wax", "way", "web", "wed", "wet", "who", "why", "win", "wit",
                    "woe", "wok", "won", "woo", "wow", "yak", "yam", "yap", "yaw", "yea", "yes", "yet", "you", "zap",
                    "zen", "zig", "zip", "zoo"
                ];
                // add more common 4–6 letter words for fallback
                const extra = ["able", "back", "bake", "bald", "ball", "band", "bare", "bark", "barn", "base", "beam",
                    "bear", "beat", "beef", "been", "beer", "bell", "belt", "bend", "bent", "best", "bike", "bill",
                    "bind", "bird", "bite", "blew", "blob", "blot", "blow", "blue", "blur", "boar", "boat", "body",
                    "bold", "bolt", "bond", "book", "boom", "boot", "bore", "born", "boss", "both", "bury", "busy",
                    "cafe", "cake", "calf", "call", "calm", "came", "camp", "cane", "cape", "card", "care", "cart",
                    "case", "cash", "cast", "cave", "cell", "chat", "chef", "chin", "chip", "chop", "cite", "city",
                    "clad", "clam", "clan", "clap", "claw", "clay", "clip", "clog", "club", "clue", "coal", "coat",
                    "code", "cold", "come", "cook", "cool", "cope", "copy", "cord", "core", "cork", "corn", "cost",
                    "cove", "cozy", "crab", "crew", "cube", "cult", "curb", "cute", "daft", "dawn", "dead", "deal",
                    "dear", "debt", "deck", "deed", "deep", "dome", "done", "door", "dose", "down", "doze", "drab",
                    "drag", "draw", "drew", "drop", "drum", "dual", "duty", "each", "earl", "ease", "edge", "edit",
                    "else", "emit", "envy", "euro", "even", "ever", "evil", "exam", "exec", "exit", "face", "fact",
                    "fair", "fake", "fall", "fame", "fang", "fare", "farm", "fast", "fate", "fear", "feat", "feed",
                    "feel", "feet", "fell", "felt", "fest", "file", "fill", "film", "fine", "fire", "firm", "fish",
                    "five", "flag", "flap", "flat", "flea", "fled", "flew", "flex", "flip", "float", "flock", "flood",
                    "floor", "flora", "flour", "flown", "fluff", "fluid", "fluke", "flush", "flute", "flux", "flyer",
                    "foam", "focal", "focus", "foggy", "foil", "fold", "folk", "follow", "food", "fool", "foot", "force",
                    "forge", "forgo", "fork", "form", "fort", "forum", "fossil", "foul", "found", "fount", "four", "fowl",
                    "foxglove"
                ];
                dictionary = dictionary.concat(extra);
                dictionary = [...new Set(dictionary)]; // dedupe
            }

            // show app
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app').classList.add('visible');
        }

        // start loading
        loadDictionary();

        // ──────────────────────────────────────────────
        // 2.  UNSCRAMBLE LOGIC
        // ──────────────────────────────────────────────
        function canFormWord(word, freq) {
            // fast path: check length
            const temp = { ...freq };
            for (let ch of word) {
                if (!temp[ch]) return false;
                temp[ch]--;
            }
            return true;
        }

        function unscramble(letters, minLen, maxLen) {
            // build frequency map of input letters (only a-z)
            const freq = {};
            for (let ch of letters.toLowerCase()) {
                if (ch >= 'a' && ch <= 'z') {
                    freq[ch] = (freq[ch] || 0) + 1;
                }
            }

            const results = [];
            const dictLen = dictionary.length;
            for (let i = 0; i < dictLen; i++) {
                const word = dictionary[i];
                const wLen = word.length;
                if (wLen >= minLen && wLen <= maxLen) {
                    if (canFormWord(word, freq)) {
                        results.push(word);
                    }
                }
            }

            // sort: longest first, then alphabetical
            results.sort((a, b) => b.length - a.length || a.localeCompare(b));
            return results;
        }

        // ──────────────────────────────────────────────
        // 3.  UI CONTROLLERS
        // ──────────────────────────────────────────────
        const lettersInput = document.getElementById('letters');
        const minInput = document.getElementById('minLen');
        const maxInput = document.getElementById('maxLen');
        const unscrambleBtn = document.getElementById('unscrambleBtn');
        const clearBtn = document.getElementById('clearBtn');
        const wordGrid = document.getElementById('wordGrid');
        const resultCount = document.getElementById('resultCount');
        const resultLabel = document.getElementById('resultLabel');

        function renderResults(words) {
            resultCount.textContent = words.length;

            if (words.length === 0) {
                wordGrid.innerHTML = `<div class="empty-msg">No words found — try different letters or adjust the length.</div>`;
                resultLabel.textContent = 'no matches';
                return;
            }

            let html = '';
            const maxDisplay = 2000; // safety
            const show = words.slice(0, maxDisplay);
            for (let w of show) {
                html += `<span class="word-tag">${w}</span>`;
            }
            if (words.length > maxDisplay) {
                html += `<span class="word-tag" style="background:#eaf2f8;">+ ${words.length - maxDisplay} more</span>`;
            }
            wordGrid.innerHTML = html;
            resultLabel.textContent = `${words.length} word${words.length > 1 ? 's' : ''}`;
        }

        function performUnscramble() {
            const letters = lettersInput.value.trim();
            if (!letters) {
                wordGrid.innerHTML = `<div class="empty-msg">Please enter some letters first.</div>`;
                resultCount.textContent = '0';
                resultLabel.textContent = 'waiting';
                return;
            }

            const minLen = parseInt(minInput.value) || 3;
            const maxLen = parseInt(maxInput.value) || 7;
            // clamp
            const min = Math.max(2, Math.min(10, minLen));
            const max = Math.max(min, Math.min(10, maxLen));
            minInput.value = min;
            maxInput.value = max;

            const results = unscramble(letters, min, max);
            renderResults(results);
        }

        // ── event listeners ──
        unscrambleBtn.addEventListener('click', performUnscramble);

        lettersInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                performUnscramble();
            }
        });

        clearBtn.addEventListener('click', () => {
            lettersInput.value = '';
            wordGrid.innerHTML = `<div class="empty-msg">Enter some letters and hit Unscramble.</div>`;
            resultCount.textContent = '0';
            resultLabel.textContent = 'ready';
            lettersInput.focus();
        });

        // auto-trigger on load with a demo? only if we want to show example.
        // We'll let the user trigger manually.

        console.log('🔤 Word Unscrambler ready!');
    </script>

</body>
</html>
